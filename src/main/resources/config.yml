# ========================================== #
#           FISHING AUDITION CONFIG          #
# ========================================== #

database:
  type: "sqlite" # "mysql" or "sqlite"
  host: "localhost"
  port: 3306
  database_name: "fishing_audition"
  username: "root"
  password: "password"
  pool_size: 10

exchange:
  tiers:
    tier-1:
      id: "vault"
      material: "GOLD_INGOT"
      name: "&6&lExchange to Vault Money"
      lore:
        - "&7Rate: &e1 FishCoin = %rate% %currency%"
        - "&a[Left-Click] &7Exchange %cost% FishCoins for %reward% %currency%"
        - "&b[Right-Click] &7Custom Amount / All"
      slot: 11
      custom_model_data: 0
      currency_type: "VAULT"
      cost-fishcoins: 100
      reward-amount: 1000
    tier-2:
      id: "playerpoints"
      material: "DIAMOND"
      name: "&b&lExchange to PlayerPoints"
      lore:
        - "&7Rate: &e1 FishCoin = %rate% %currency%"
        - "&a[Left-Click] &7Exchange %cost% FishCoins for %reward% %currency%"
        - "&b[Right-Click] &7Custom Amount / All"
      slot: 15
      custom_model_data: 0
      currency_type: "PLAYERPOINTS"
      cost-fishcoins: 100
      reward-amount: 100

# Toa do khu vuc cau ca (Se duoc tu dong cap nhat khi dung lenh /fish setregion)
# region:
#   world: "world"
#   pos1:
#     x: 0.0
#     y: 0.0
#     z: 0.0
#   pos2:
#     x: 0.0
